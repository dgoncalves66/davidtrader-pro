<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#0a0e1a"/>
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#00cc66"/>
    </linearGradient>
  </defs>
  <!-- Chart bars -->
  <rect x="80" y="310" width="48" height="90" rx="6" fill="#1e3a5f" opacity="0.8"/>
  <rect x="148" y="270" width="48" height="130" rx="6" fill="#1e3a5f" opacity="0.8"/>
  <rect x="216" y="230" width="48" height="170" rx="6" fill="url(#green)" opacity="0.9"/>
  <rect x="284" y="190" width="48" height="210" rx="6" fill="url(#green)"/>
  <rect x="352" y="150" width="48" height="250" rx="6" fill="url(#green)"/>
  <!-- Trend line -->
  <polyline points="104,320 172,275 240,235 308,190 376,148" fill="none" stroke="#00ff88" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- D letter -->
  <text x="390" y="115" font-family="Arial Black, sans-serif" font-weight="900" font-size="90" fill="#00ff88" text-anchor="middle">D</text>
  <!-- Bottom line -->
  <line x1="64" y1="412" x2="448" y2="412" stroke="#1e3a5f" stroke-width="4" opacity="0.6"/>
</svg>
